<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solara Bay — an open-world crime game in the spirit of GTA 6. Steal cars and boats, outrun the SBPD, run eight story missions for Lena Cruz.">
<link rel="icon" href="data:,">
<title>Solara Bay — Open-World Crime Game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0f1e;
    overflow: hidden;
  }
  #stage {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block;
    background: #000;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
